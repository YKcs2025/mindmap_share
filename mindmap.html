<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マインドマップ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>マインドマップ</title>
<script>/* URLで開いたときだけアプリ化（ホーム画面追加・オフライン）を有効にする */
if (/^https?:$/.test(location.protocol)) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.append(l); }</script>
<style>
:root{
  --bg:#f6f5f2; --surf:#ffffff; --surf2:#efeee9; --text:#1e1e1c; --muted:#6c6b66; --line:#d8d6ce;
  --accent:#2f6fde; --accent-ink:#fff; --danger:#d23b3b; --edge:#9b988f; --xlink:#c2410c;
  --grid:rgba(0,0,0,.06); --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.08);
  --r:12px; --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17171a; --surf:#232327; --surf2:#2d2d32; --text:#ececea; --muted:#9c9b97; --line:#3b3b41;
  --accent:#6ea0ff; --accent-ink:#0b1630; --danger:#ff6b6b; --edge:#6e6d73; --xlink:#fb923c;
  --grid:rgba(255,255,255,.06); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{background:var(--surf2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:8px;min-width:40px;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- home ---------- */
#home{overflow:auto}
.home-in{max-width:960px;width:100%;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.home-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.home-head h1{font-size:22px;margin:0 auto 0 0;letter-spacing:.02em}
.store{display:flex;align-items:flex-start;gap:8px 10px;flex-wrap:wrap;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:16px;font-size:14px}
.store b{font-weight:600}
.store .stxt{flex:1 1 220px;min-width:0;line-height:1.5}
.store .sbtns{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.store .dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex:none;margin-top:7px}
@media (max-width:480px){.home-head h1{font-size:19px}#hImport span,#hNew .lg{display:none}.home-head{gap:8px}#hImport{padding:8px;min-width:40px;justify-content:center}}
.store.warn .dot{background:#d97706}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:110px;transition:transform .08s}
.card:hover{border-color:var(--accent)}
.card:active{transform:scale(.99)}
.card h3{margin:0;font-size:16px;line-height:1.35;word-break:break-word}
.card .meta{font-size:12px;color:var(--muted)}
.card .dirn{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.card .acts{margin-top:auto;display:flex;gap:4px;justify-content:flex-end}
.card .acts button{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted)}
.card .acts button:hover{background:var(--surf2);color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.tip{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.7}

/* ---------- editor ---------- */
#editor{background:var(--bg)}
.top{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;pointer-events:none}
.top>*{pointer-events:auto}
.top .ttl{min-width:0;max-width:40vw;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;padding:10px 12px}
.top .gap{flex:1}
.status{padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.status{font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none}
.status.err{color:var(--danger)}
.glass{background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:24px 24px}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges,#ovl{position:absolute;left:-50000px;top:-50000px;width:100000px;height:100000px;overflow:visible;pointer-events:none}
#ovl{z-index:5}
#edges .e{fill:none;stroke:var(--edge);stroke-width:2}
#edges .x{fill:none;stroke:var(--xlink);stroke-width:2;stroke-dasharray:6 5}
#edges .xhit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
#edges .x.sel{stroke-width:3.5;stroke-dasharray:none}
#edges .ehit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke;cursor:pointer}
#edges .e.sel{stroke:var(--accent)!important;stroke-width:4}
#ovl .hdl{fill:var(--surf);stroke:var(--accent);stroke-width:3;pointer-events:all;cursor:grab}
#ovl .tmp{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 5}
.node.drop{outline:3px solid var(--accent);outline-offset:4px;box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 18%,transparent)}
.node.dim{opacity:.35}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 54px);z-index:21;padding:9px 14px;font-size:13px;pointer-events:none;border-color:var(--accent);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#edges text{font-size:12px;fill:var(--xlink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;font-family:var(--font)}
.node{position:absolute;transform:translate(-50%,-50%);--nb:var(--line);--nf:var(--surf);
  background:var(--nf);border:1.5px solid var(--nb);border-radius:12px;padding:8px 12px;width:max-content;max-width:300px;min-width:40px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);user-select:none;-webkit-user-select:none;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:6px}
.node .txt{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;text-align:center;outline:none;min-width:1em}
.node .txt b{font-weight:700}
.node .txt a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.node.root .txt b{font-weight:900}
#fmt{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:calc(max(8px,env(safe-area-inset-top)) + 54px);z-index:22;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:5px;max-width:calc(100vw - 16px)}
#fmt button{border:0;background:none;border-radius:9px;min-width:42px;height:44px;padding:0 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--text);cursor:pointer;flex:none}
#fmt button:hover,#fmt button.on{background:var(--surf2)}
#fmt button .g{font-size:17px;line-height:1;font-family:Georgia,serif}
#fmt button.done{background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;padding:0 14px}
#fmt .cols{display:flex;gap:6px;flex-basis:100%;justify-content:center;padding:6px 4px 2px;border-top:1px solid var(--line);margin-top:2px}
#fmt .cols button{min-width:30px;width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--surf);outline:1.5px solid var(--line)}
.rtprev{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;white-space:pre-wrap;word-break:break-word;min-height:40px;line-height:1.5}
.rtprev a{color:var(--accent)}
.node .txt:empty::before{content:"（空）";color:var(--muted)}
.node.imgonly .txt{display:none}
.node.imgonly{padding:4px}
.node img{display:block;border-radius:8px;pointer-events:none;object-fit:cover;background:var(--surf2)}
.node.root{padding:12px 18px;border-width:2px;font-weight:700}
.node.root .txt{font-size:18px}
.node.float{border-style:dashed}
.node.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.node.target{outline:2.5px dashed var(--xlink);outline-offset:3px}
.node.editing{cursor:text}
.node.editing .txt{user-select:text;-webkit-user-select:text;min-width:3em}
.node .nmark{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--surf);border:1.5px solid var(--nb);display:flex;align-items:center;justify-content:center}
.node .nmark svg{width:10px;height:10px;stroke-width:2.4}
.node .fold{position:absolute;top:50%;transform:translateY(-50%);right:-13px;min-width:22px;height:22px;border-radius:11px;border:1.5px solid var(--nb);background:var(--surf);font-size:11px;line-height:1;padding:0 5px;cursor:pointer;color:var(--muted)}
.node .fold.l{right:auto;left:-13px}
.node .rsz{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--surf);cursor:nwse-resize}
.c-red{--nb:#e05252}.c-orange{--nb:#e8873a}.c-yellow{--nb:#d4a514}.c-green{--nb:#3e9e5c}.c-teal{--nb:#1f9c9c}
.c-blue{--nb:#3b78e0}.c-purple{--nb:#8a5cd6}.c-pink{--nb:#d6559a}.c-gray{--nb:#8a8a8a}
.node[class*=" c-"]{--nf:color-mix(in srgb,var(--nb) 13%,var(--surf))}

.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;padding:5px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar button{border:0;background:none;border-radius:9px;padding:6px 6px;min-width:46px;white-space:nowrap;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--text);cursor:pointer}
.bar button:hover{background:var(--surf2)}
.bar button.danger{color:var(--danger)}
.bar button:disabled{opacity:.35}
.zoom{position:absolute;right:10px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px);z-index:19;display:flex;flex-direction:column;padding:3px}
.zoom button{border:0;background:none;width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom button:hover{background:var(--surf2)}
.zoom span{font-size:10px;text-align:center;color:var(--muted);padding:2px 0}
.zoom #zTidy{color:var(--accent);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:2px}
#mode{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 16px);top:calc(max(8px,env(safe-area-inset-top)) + 54px);z-index:21;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;border-color:var(--xlink)}

/* sheet / side panel */
#sheet{position:absolute;z-index:25;display:flex;flex-direction:column;gap:12px;padding:14px;overflow:auto;
  left:0;right:0;bottom:0;max-height:62dvh;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom))}
@media (max-width:480px){.status.ok{display:none}.bar button{min-width:43px;padding:6px 4px;font-size:10px}}
@media (min-width:820px){#sheet{left:auto;right:12px;top:64px;bottom:auto;width:340px;max-height:calc(100dvh - 160px);border-radius:14px;border-bottom:1px solid var(--line)}}
#sheet .hd{display:flex;align-items:center;gap:8px}
#sheet .hd b{flex:1}
#sheet label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
#sheet textarea,.dlg textarea,.dlg input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;font-size:16px;resize:vertical}
#sheet textarea:focus,.dlg textarea:focus,.dlg input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surf);outline:1.5px solid var(--line);cursor:pointer;padding:0}
.sw button.on{outline:2.5px solid var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imgprev{max-width:100%;max-height:140px;border-radius:8px;display:block}
input[type=range]{width:100%;accent-color:var(--accent)}

/* menu, dialog, toast */
.menu{position:fixed;z-index:60;min-width:240px;padding:6px;display:flex;flex-direction:column;max-height:80dvh;overflow:auto}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--surf2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu .chk{margin-left:auto;color:var(--accent);font-weight:700}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surf);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:90dvh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:17px}
.dlg .body{font-size:14px;line-height:1.65;color:var(--text)}
.dlg .body p{margin:0 0 8px}
.dlg .body small{color:var(--muted)}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg .opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:none;text-align:left;width:100%}
.dlg .opt:hover{border-color:var(--accent)}
.dlg .opt:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.dlg .opt b{display:block;margin-bottom:2px}
.dlg .opt span{font-size:12.5px;color:var(--muted);line-height:1.55}
.dlg code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surf2);padding:1px 5px;border-radius:5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 76px);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:86vw;box-shadow:var(--shadow)}
#drop{position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:20px;z-index:90;pointer-events:none;background:color-mix(in srgb,var(--accent) 8%,transparent)}
</style>
</head>
<body>

<!-- ===== 一覧 ===== -->
<section id="home" class="screen">
  <div class="home-in">
    <div class="home-head">
      <h1>マインドマップ</h1>
      <button class="btn" id="hImport"></button>
      <button class="btn icon" id="hMore" title="その他"></button>
      <button class="btn primary" id="hNew"></button>
    </div>
    <div class="store" id="storeBox"></div>
    <div class="grid" id="mapGrid"></div>
    <div class="tip" id="homeTip"></div>
  </div>
</section>

<!-- ===== 編集 ===== -->
<section id="editor" class="screen hidden">
  <div id="vp"><div id="world"><svg id="edges" xmlns="http://www.w3.org/2000/svg"><defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--xlink)"/></marker>
  </defs><g id="eg" transform="translate(50000 50000)"></g></svg><svg id="ovl" xmlns="http://www.w3.org/2000/svg"><g id="eg2" transform="translate(50000 50000)"></g><g id="eg3" transform="translate(50000 50000)"></g></svg></div></div>
  <div class="top">
    <button class="btn icon glass" id="eBack" title="一覧へ"></button>
    <div class="ttl glass" id="eTitle"></div>
    <div class="gap"></div>
    <span class="status" id="eStatus"></span>
    <button class="btn icon glass" id="eUndo" title="元に戻す (Ctrl+Z)"></button>
    <button class="btn icon glass" id="eRedo" title="やり直す (Ctrl+Shift+Z)"></button>
    <button class="btn icon glass" id="eAI" title="AI用にMarkdownをコピー"></button>
    <button class="btn icon glass" id="eShare" title="共有"></button>
    <button class="btn icon glass" id="eMore" title="メニュー"></button>
  </div>
  <div id="hint" class="glass hidden"></div>
  <div id="fmt" class="glass hidden"></div>
  <div id="mode" class="glass hidden"><span id="modeTxt"></span><button class="btn" id="modeCancel">やめる</button></div>
  <div class="zoom glass">
    <button id="zIn" title="拡大"></button><span id="zLbl">100%</span><button id="zOut" title="縮小"></button><button id="zFit" title="全体を表示"></button><button id="zTidy" title="ちょうどよく配置"></button>
  </div>
  <div class="bar glass" id="bar"></div>
  <div id="sheet" class="glass hidden"></div>
</section>

<div id="toast"></div>
<div id="drop" class="hidden"></div>
<input type="file" id="fImg" accept="image/*" class="hidden">
<input type="file" id="fImport" accept=".zip,.json,.md,.markdown,.txt,application/zip,application/json,text/markdown,text/plain" multiple class="hidden">

<script>
'use strict';
const __PRISTINE = document.documentElement.cloneNode(true);
/* =========================================================
   マインドマップ  — 1ファイル完結エディタ
   保存形式:  maps/<フォルダ>/map.json  (正: レイアウト含む全データ)
             maps/<フォルダ>/map.md    (AI向け: 階層Markdown, 自動生成)
             maps/<フォルダ>/images/   (画像)
             maps/index.md, maps/README.md
   ========================================================= */
const FORMAT = 'mindmap/1';

/* ---------------- 小物 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const ICONS = {
  plus:'M12 5v14M5 12h14', child:'M4 6h7M7.5 6v8a4 4 0 0 0 4 4H20M17 15l3 3-3 3', sib:'M4 6h12M4 12h12M4 18h7M17 15v6M14 18h6',
  edit:'M4 20h4L19 9l-4-4L4 16v4z', image:'M4 5h16v14H4zM9 10.5a1.5 1.5 0 1 0-.01 0M20 15l-5-5-8 9', trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',
  link:'M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1',
  move:'M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20', undo:'M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3', enter:'M20 5v7a3 3 0 0 1-3 3H5M9 11l-4 4 4 4', wand:'M4 20L14 10M16 3v4M14 5h4M20 9v3M18.5 10.5h3M9 3v2.5M7.75 4.25h2.5', eraser:'M7 21h10M5 15l9-9 5 5-9 9H7zM10 10l5 5',

     **太字**   <u>下線</u>   <span style="color:red">色</span>   [文字](https://…)   https://…（自動リンク）   改行は \n
   内部では「1文字ずつ書式を持つ配列」に変換して扱う */
const TEXT_COLORS = [['', '標準'], ['red', '赤'], ['orange', '橙'], ['green', '緑'], ['teal', '青緑'], ['blue', '青'], ['purple', '紫'], ['pink', '桃'], ['gray', '灰']];

function parseMarkup(src){

      if (rest.startsWith('**') && (st.b || rest.indexOf('**', 2) > 2)) { st.b = !st.b; i += 2; continue; }  // 閉じの ** があるときだけ太字

function toast(msg, ms = 2400){ const box = $('#toast'); while (box.children.length >= 2) box.firstChild.remove(); const d = document.createElement('div'); d.textContent = msg; box.append(d); setTimeout(() => d.remove(), ms); }
function dialog({ title = '', html = '', input = null, buttons = [{ label: 'OK', value: true, primary: true }], onBuild } = {}){
  return new Promise(resolve => {
    const sc = document.createElement('div'); sc.className = 'scrim';
    const inp = input ? (input.multiline
      ? `<textarea rows="${input.rows || 10}" placeholder="${esc(input.placeholder || '')}">${esc(input.value || '')}</textarea>`
      : `<input type="text" value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}">`) : '';
    sc.innerHTML = `<div class="dlg" role="dialog">${title ? `<h2>${esc(title)}</h2>` : ''}<div class="body">${html}</div>${inp}<div class="btns"></div></div>`;
    const field = sc.querySelector('textarea,input');
    const done = v => { sc.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
      if (e.key === 'Enter' && field && field.tagName === 'INPUT' && !e.isComposing) { e.preventDefault(); done(field.value); }
    };
    for (const b of buttons) {
      const el = document.createElement('button'); el.className = 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''); el.textContent = b.label;
      el.onclick = () => done(b.value === '$input' ? (field ? field.value : '') : b.value);
      sc.querySelector('.btns').append(el);
    }
    sc.addEventListener('pointerdown', e => { if (e.target === sc) done(null); });
    document.addEventListener('keydown', onKey, true);
    document.body.append(sc);
    if (onBuild) onBuild(sc.querySelector('.dlg'), done);
    if (field) { field.focus(); if (field.select && input.select !== false) field.select(); }
  });
}

  for (const it of items) {

let _db;
function idb(){
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('mindmap-local', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('maps'); d.createObjectStore('images'); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _db;
}
async function tx(store, mode, fn){
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const s = t.objectStore(store); let out;
    Promise.resolve(fn(s)).then(v => out = v);
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

/* ---------------- ZIP（無圧縮で書き出し / 無圧縮・deflate を読み込み） ---------------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const data = await toU8(f.data), nm = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    cen.push(ch.buffer, nm);
    off += 30 + nm.length + data.length;

  const cenSize = cen.reduce((a, b) => a + b.byteLength, 0);

  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cenSize, true); end.setUint32(16, off, true);

async function readZip(blob){
  const b = new Uint8Array(await blob.arrayBuffer()), v = new DataView(b.buffer);
  let e = b.length - 22; while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('ZIPファイルではありません');
  const n = v.getUint16(e + 10, true); let p = v.getUint32(e + 16, true); const out = [];
  const u8dec = new TextDecoder('utf-8', { fatal: true }); let sjis; try { sjis = new TextDecoder('shift_jis'); } catch {}
  for (let i = 0; i < n; i++) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const fl = v.getUint16(p + 8, true), meth = v.getUint16(p + 10, true), cs = v.getUint32(p + 20, true), nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    const nb = b.subarray(p + 46, p + 46 + nl); let name;
    try { name = u8dec.decode(nb); } catch { name = (fl & 0x800 || !sjis) ? new TextDecoder().decode(nb) : sjis.decode(nb); }
    p += 46 + nl + xl + cl;
    if (name.endsWith('/')) continue;
    const ds = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
    let data = b.subarray(ds, ds + cs);
    if (meth === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());

}

/* ---------------- Markdown（AI向け）書き出し ---------------- */
const MD_HELP = '<!-- AI向け書式: 箇条書きのインデント=階層 / "> "=メモ / ![..](images/..)=画像 / <!-- id:.. -->=ノードID（既存ノードを編集するときは残し、新しいノードには付けない） / 文字の書式: **太字** <u>下線</u> <span style="color:red">色</span> [文字](URL) <br>=改行 -->';
function mdText(t){ return String(t || '').replace(/\r/g, '').replace(/\n/g, '<br>'); }
function toMarkdown(m){
  const T = mapTools(m), L = [];
  const yq = s => JSON.stringify(String(s));
  L.push('---', `format: mindmap-md/1`, `title: ${yq(m.title)}`, `id: ${m.id}`, `created: ${m.created}`, `updated: ${m.updated}`, `nodes: ${m.nodes.length}`, '---', '', MD_HELP, '');
  const extras = (n, ind) => {
    if (n.note) for (const ln of n.note.replace(/\r/g, '').split('\n')) L.push(`${ind}> ${ln}`.trimEnd());
    if (n.image) L.push(`${ind}![${plain(n.text).replace(/[\[\]\n]/g, ' ').trim() || '画像'}](images/${n.image.file})`);
  };
  const walk = (id, depth) => {
    for (const c of T.kids(id)) {
      const n = T.N.get(c), ind = '  '.repeat(depth);
      L.push(`${ind}- ${mdText(n.text) || (n.image ? '（画像）' : '（空）')} <!-- id:${n.id} -->`);
      extras(n, ind + '  ');
      walk(c, depth + 1);
    }
  };
  const root = T.N.get(m.rootId);
  L.push(`# ${mdText(root.text) || '（無題）'} <!-- id:${root.id} -->`); extras(root, ''); L.push('');
  walk(root.id, 0);
  const floats = T.kids(null).filter(id => id !== m.rootId);
  if (floats.length) {
    L.push('', '## 独立ノード', '');
    for (const f of floats) { const n = T.N.get(f); L.push(`- ${mdText(n.text) || (n.image ? '（画像）' : '（空）')} <!-- id:${n.id} -->`); extras(n, '  '); walk(f, 1); }
  }
  if (m.links.length) {
    L.push('', '## 関連', '');
    for (const k of m.links) {
      const a = T.N.get(k.from), b = T.N.get(k.to); if (!a || !b) continue;
      L.push(`- ${mdText(a.text) || a.id} → ${mdText(b.text) || b.id}${k.label ? ': ' + mdText(k.label) : ''} <!-- link:${a.id}>${b.id} -->`);
    }
  }
  return L.join('\n').replace(/\n{3,}/g, '\n\n') + '\n';
}

/* ---------------- Markdown 読み込み（AIが書いた/編集したもの） ---------------- */
function parseMarkdown(src){
  let text = String(src).replace(/\r\n?/g, '\n').replace(/^﻿/, '');
  let title = null;
  const fm = text.match(/^---\n([\s\S]*?)\n---\n?/);
  if (fm) { const t = fm[1].match(/^title:\s*(.+)$/m); if (t) { title = t[1].trim(); try { title = JSON.parse(title); } catch { title = title.replace(/^['"]|['"]$/g, ''); } } text = text.slice(fm[0].length); }
  const nodes = [], links = [];
  const mk = (raw, parent, floating) => {
    let s = raw, id = null;
    const im = s.match(/<!--\s*id:\s*([\w-]+)\s*-->/); if (im) { id = im[1]; s = s.replace(im[0], ''); }
    s = s.replace(/<!--[\s\S]*?-->/g, '').replace(/<br\s*\/?>/gi, '\n').trim();
    if (s === '（空）' || s === '（画像）') s = '';
    const n = { id, text: s, note: '', image: null, parent, floating: !!floating, idx: nodes.length };
    nodes.push(n); return n;
  };
  let root = null, section = 'main', last = null, stack = [], heads = [], base = null, inComment = false;
  const isFloatH = s => /^(独立|未接続|フローティング|floating)/i.test(s);
  const isLinkH = s => /^(関連|関係|リンク|links?|relations?)/i.test(s);
  for (const line of text.split('\n')) {
    if (inComment) { if (line.includes('-->')) inComment = false; continue; }
    if (/^\s*<!--/.test(line) && !/-->/.test(line)) { inComment = true; continue; }
    if (/^\s*<!--[\s\S]*-->\s*$/.test(line)) continue;
    if (/^\s*$/.test(line)) continue;
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      const lv = h[1].length, body = h[2].trim(), plain = body.replace(/<!--[\s\S]*?-->/g, '').trim();
      stack = [];
      if (lv === 1 && !root) { root = mk(body, null); last = root; base = root; section = 'main'; heads = [root]; continue; }
      if (lv === 2 && isFloatH(plain)) { section = 'float'; base = null; last = null; continue; }
      if (lv === 2 && isLinkH(plain)) { section = 'links'; last = null; continue; }
      if (section === 'links') continue;
      if (!root) { root = mk(title || 'マインドマップ', null); heads = [root]; }
      const hl = Math.max(1, lv - 1);
      heads.length = Math.min(heads.length, hl);
      const par = section === 'float' ? (heads[hl - 1] && heads[hl - 1] !== root ? heads[hl - 1] : null) : (heads[hl - 1] || root);
      const n = mk(body, par, section === 'float' && !par); heads[hl] = n; base = n; last = n; continue;
    }
    const b = line.match(/^([ \t]*)(?:[-*+]|\d+[.)])\s+(.*)$/);
    if (b) {
      const ind = b[1].replace(/\t/g, '    ').length;
      if (section === 'links') {
        const raw = b[2]; const lm = raw.match(/<!--\s*link:\s*([\w-]+)\s*>\s*([\w-]+)\s*-->/);
        const body = raw.replace(/<!--[\s\S]*?-->/g, '').trim();
        const am = body.match(/^(.*?)\s*(?:→|->|⇒|=>)\s*(.*?)(?:\s*[:：]\s*(.*))?$/);
        if (lm || am) links.push({ from: lm?.[1], to: lm?.[2], fromText: am?.[1]?.trim(), toText: am?.[2]?.trim(), label: (am?.[3] || '').trim() });
        continue;
      }
      if (!root && section === 'main') { root = mk(title || 'マインドマップ', null); base = root; heads = [root]; }
      while (stack.length && stack[stack.length - 1].ind >= ind) stack.pop();
      const par = stack.length ? stack[stack.length - 1].n : base;
      const n = mk(b[2], par, !par);
      stack.push({ ind, n }); last = n; continue;
    }
    if (section === 'links' || !last) continue;
    const t = line.trim();
    const img = t.match(/^!\[[^\]]*\]\(([^)]+)\)$/);
    if (img) { last.image = decodeURIComponent(img[1].trim().replace(/^\.?\/?images\//, '')); continue; }
    const q = line.match(/^\s*>\s?(.*)$/);
    const nl = q ? q[1] : t;
    last.note = last.note ? last.note + '\n' + nl : nl;
  }
  if (!root) root = mk(title || 'マインドマップ', null);
  return { title: title || root.text, root, nodes, links };
}

// map.json: 人にもAIにも読みやすいよう、ノード・関連線は1行1件で書き出す
function toJson(m){
  const { nodes, links, ...head } = m, h = JSON.stringify(head, null, 2).slice(0, -2);
  const nl = nodes.map(n => '    ' + JSON.stringify(n)).join(',\n'), ll = links.map(k => '    ' + JSON.stringify(k)).join(',\n');

}
function newMap(title){
  const t = nowIso(), rootId = 'root';
  return { format: FORMAT, id: 'm' + rid(8), title, created: t, updated: t, rootId,
    nodes: [{ id: rootId, parent: null, text: escMarkup(title), note: '', x: 0, y: 0, color: '' }], links: [] };
}
function normalize(m){
  if (!m || !Array.isArray(m.nodes)) throw new Error('map.json の形式が正しくありません');
  const seen = new Set();
  m.nodes = m.nodes.filter(n => n && n.id && !seen.has(n.id) && seen.add(n.id)).map(n => ({
    id: String(n.id), parent: n.parent ?? null, text: String(n.text ?? ''), note: String(n.note ?? ''),
    x: +n.x || 0, y: +n.y || 0, color: n.color || '', ...(n.image && n.image.file ? { image: { file: n.image.file, w: +n.image.w || 200, ar: +n.image.ar || 1.5 } } : {}),
    ...(n.collapsed ? { collapsed: true } : {}),
  }));
  if (!m.nodes.length) m.nodes.push({ id: 'root', parent: null, text: m.title || 'マインドマップ', note: '', x: 0, y: 0, color: '' });
  if (!seen.has(m.rootId)) m.rootId = m.nodes[0].id;
  const N = new Map(m.nodes.map(n => [n.id, n]));
  for (const n of m.nodes) {

    // 循環を断つ
    let p = n.parent, steps = 0; while (p && steps++ < 10000) { if (p === n.id) { n.parent = null; break; } p = N.get(p)?.parent; }
  }

  m.format = FORMAT; m.id = m.id || 'm' + rid(8); m.created = m.created || nowIso(); m.updated = m.updated || m.created;
  m.title = plain(N.get(m.rootId).text) || m.title || '無題';
  return m;
}
function mapTools(m){
  const N = new Map(m.nodes.map(n => [n.id, n]));
  const byParent = new Map();
  for (const n of m.nodes) { const k = n.parent ?? null; if (!byParent.has(k)) byParent.set(k, []); byParent.get(k).push(n); }
  const root = N.get(m.rootId);
  const kids = id => {
    const arr = (byParent.get(id ?? null) || []).slice();
    if (id === m.rootId) {  // ルート直下: 右側を上から、続いて左側を上から
      const R = arr.filter(n => n.x >= root.x).sort((a, b) => a.y - b.y || a.x - b.x), Lf = arr.filter(n => n.x < root.x).sort((a, b) => a.y - b.y || b.x - a.x);
      return [...R, ...Lf].map(n => n.id);
    }
    if (id == null) return arr.sort((a, b) => (a.id === m.rootId ? -1 : b.id === m.rootId ? 1 : a.y - b.y || a.x - b.x)).map(n => n.id);
    return arr.sort((a, b) => a.y - b.y || a.x - b.x).map(n => n.id);
  };
  const desc = id => { const out = []; const st = [id]; while (st.length) { const c = st.pop(); for (const n of byParent.get(c) || []) { out.push(n.id); st.push(n.id); } } return out; };
  return { N, kids, desc };
}

function measure(){ for (const [id, el] of nodeEls) sizes.set(id, { w: el.offsetWidth, h: el.offsetHeight }); }
function sz(id){ const s = sizes.get(id); if (s) return s; const n = node(id); const len = [...plain(n.text)].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 14 : 8), 0) + 26;

function clipToBox(cx, cy, w, h, tx, ty){

function reparent(src, target, opt = {}){

function pickImage(cb){ const f = $('#fImg'); f.value = ''; f.onchange = async () => { if (f.files[0]) cb(await processImage(f.files[0])); }; f.click(); }
async function processImage(file){
  try {
    let src, w, h;
    try { src = await createImageBitmap(file); w = src.width; h = src.height; }
    catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); w = src.naturalWidth || 400; h = src.naturalHeight || 300; }

    const s = Math.min(1, 1600 / Math.max(w, h)), c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);

    let blob = await enc('image/webp'); if (!blob || blob.type !== 'image/webp') blob = await enc('image/jpeg');

    return { blob, ext: { 'image/webp': 'webp', 'image/jpeg': 'jpg', 'image/png': 'png' }[blob.type] || 'jpg', ar };
  } catch (e) { toast('画像を読み込めませんでした'); throw e; }
}

/* ---------------- 自動整列 ---------------- */
function autoLayout(startId, balance = false, opts = {}){
  const GX = 56, GY = 14, T = S.T;
  const vk = id => node(id).collapsed ? [] : T.kids(id);
  const memo = new Map();
  const sh = id => { if (memo.has(id)) return memo.get(id); const k = vk(id); const kh = k.reduce((a, c) => a + sh(c), 0) + GY * Math.max(0, k.length - 1); const v = Math.max(sz(id).h, kh); memo.set(id, v); return v; };
  const before = new Map(S.m.nodes.map(n => [n.id, { x: n.x, y: n.y }]));
  const place = (id, x, top, dir) => {
    const n = node(id), s = sz(id), k = vk(id); n.x = x;
    const kh = k.reduce((a, c) => a + sh(c), 0) + GY * Math.max(0, k.length - 1), H = Math.max(s.h, kh);
    n.y = top + H / 2; let y = top + (H - kh) / 2;
    for (const c of k) { place(c, x + dir * (s.w / 2 + GX + sz(c).w / 2), y, dir); y += sh(c) + GY; }
  };
  const layoutRoot = () => {
    const r = node(S.m.rootId), rs = sz(r.id), ks = vk(r.id);
    let R = [], Lf = [];
    if (balance) { let hr = 0, hl = 0; for (const c of ks) { if (hr <= hl) { R.push(c); hr += sh(c); } else { Lf.push(c); hl += sh(c); } } }
    else { R = ks.filter(c => node(c).x >= r.x); Lf = ks.filter(c => node(c).x < r.x); }
    for (const [side, dir] of [[R, 1], [Lf, -1]]) {
      const tot = side.reduce((a, c) => a + sh(c), 0) + GY * 2 * Math.max(0, side.length - 1); let y = r.y - tot / 2;
      for (const c of side) { place(c, r.x + dir * (rs.w / 2 + GX * 1.3 + sz(c).w / 2), y, dir); y += sh(c) + GY * 2; }
    }
  };
  const layoutSub = id => { const n = node(id), ox = n.x, oy = n.y, dir = n.parent ? sideOf(n) : 1; place(id, n.x, 0, dir); const dx = ox - n.x, dy = oy - n.y; shiftTree(id, dx, dy); };
  if (startId && startId !== S.m.rootId) layoutSub(startId);
  else {
    layoutRoot();
    // 独立ノード群はメインの下に並べる（未配置または balance 時）
    const floats = T.kids(null).filter(id => id !== S.m.rootId);
    if (floats.length && (balance || opts.stackFloats)) {
      let maxY = -Infinity; for (const id of [S.m.rootId, ...visDesc(S.m.rootId)]) maxY = Math.max(maxY, node(id).y + sz(id).h / 2);
      let y = maxY + 80; const x0 = node(S.m.rootId).x;
      for (const f of floats) { place(f, x0, y, 1); y += sh(f) + 40; }
    } else for (const f of floats) layoutSub(f);
  }
  // 折りたたまれた子孫は親と一緒に移動
  for (const n of S.m.nodes) if (n.collapsed) { const b = before.get(n.id), dx = n.x - b.x, dy = n.y - b.y; if (dx || dy) for (const d of T.desc(n.id)) { const c = node(d); c.x = before.get(d).x + dx; c.y = before.get(d).y + dy; } }
}

/* ちょうどよく配置: 開いているノードだけで詰めて並べ直し、なめらかに動かす
   opt.balance: 左右の枝数を均等に ／ opt.anchor: このノードの画面上の位置を保つ（全体表示しない） ／ opt.noCp: 履歴を積まない */
function tidyAll(opt = {}){
  if (!S.m) return;
  if (S.editing) commitEdit();
  if (S.anim) S.anim.finish();
  if (!opt.noCp) checkpoint();
  render(); measure();
  const from = new Map(S.m.nodes.map(n => [n.id, { x: n.x, y: n.y }]));
  autoLayout(null, !!opt.balance, { stackFloats: true });
  for (const n of S.m.nodes) { n.x = Math.round(n.x); n.y = Math.round(n.y); }
  const to = new Map(S.m.nodes.map(n => [n.id, { x: n.x, y: n.y }]));
  let V1;
  if (opt.anchor && from.has(opt.anchor)) { const f = from.get(opt.anchor), t = to.get(opt.anchor); V1 = { ...S.V, x: S.V.x - (t.x - f.x) * S.V.z, y: S.V.y - (t.y - f.y) * S.V.z }; }
  else V1 = fitTarget();
  for (const [id] of nodeEls) { const n = node(id), f = from.get(id); n.x = f.x; n.y = f.y; }
  animateLayout(to, V1);
}
function animateLayout(to, V1, ms = 340){
  const items = [...nodeEls.keys()].map(id => ({ n: node(id), el: nodeEls.get(id), f: { x: node(id).x, y: node(id).y }, t: to.get(id) })).filter(it => it.t);
  const V0 = { ...S.V };
  const done = () => {
    S.anim = null;
    for (const [id, t] of to) { const n = node(id); if (n) { n.x = t.x; n.y = t.y; } }
    if (V1) { S.V = V1; applyView(); }

  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
  const t0 = performance.now(); let stop = false;

  const step = now => {
    if (stop) return;
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    for (const it of items) { it.n.x = it.f.x + (it.t.x - it.f.x) * e; it.n.y = it.f.y + (it.t.y - it.f.y) * e; it.el.style.left = it.n.x + 'px'; it.el.style.top = it.n.y + 'px'; }
    if (V1) { S.V = { z: V0.z + (V1.z - V0.z) * e, x: V0.x + (V1.x - V0.x) * e, y: V0.y + (V1.y - V0.y) * e }; applyView(); }
    renderEdges();
    if (k < 1) requestAnimationFrame(step); else done();
  };
  requestAnimationFrame(step);
}

    : nEl ? { k: 'n', id: nEl.dataset.id, href: t.closest('.txt a')?.getAttribute('href') || '' } : lEl ? { k: 'l', id: lEl.dataset.link } : eEl ? { k: 'e', id: eEl.dataset.edge } : { k: 'bg' };

  if (!PTR.has(e.pointerId)) return;

  if (!G) return;
  const dx = e.clientX - G.sx, dy = e.clientY - G.sy;
  if (G.type === 'pending' && Math.hypot(dx, dy) > (G.touch ? 9 : 4)) {
    if (G.tg.k === 'n' && !S.mode) {
      G.type = 'drag'; checkpoint();
      const ids = S.withKids !== e.altKey ? [G.tg.id, ...S.T.desc(G.tg.id)] : [G.tg.id];
      G.items = ids.map(id => ({ n: node(id), x: node(id).x, y: node(id).y }));
      if (S.sel?.id !== G.tg.id) select({ t: 'n', id: G.tg.id });
      G.canDrop = G.tg.id !== S.m.rootId;
    } else if (G.tg.k === 'hdl') { G.type = 'rewire'; }
    else if (G.tg.k !== 'fold' && G.tg.k !== 'rsz') { G.type = 'pan'; vp.classList.add('panning'); }
  }
  if (G.type === 'drag') {
    const z = S.V.z;
    for (const it of G.items) { it.n.x = Math.round(it.x + dx / z); it.n.y = Math.round(it.y + dy / z); const el = nodeEls.get(it.n.id); if (el) { el.style.left = it.n.x + 'px'; el.style.top = it.n.y + 'px'; } }

    setDrop(G, findDrop(e.clientX, e.clientY, t => rewireOk(g, t)), id => g.end === 'p' ? `離すと「${short(node(id).text)}」につなぎ替えます` : `「${short(node(id).text)}」につなぎ替えます`);
  } else if (G.type === 'pan') { S.V.x = G.V0.x + dx; S.V.y = G.V0.y + dy; applyView(); }
  else if (G.type === 'rsz') { const n = node(G.tg.id); n.image.w = Math.round(clamp(G.w0 + 2 * dx / S.V.z, 40, 1200)); const im = nodeEls.get(n.id)?.querySelector('img'); if (im) { im.style.width = n.image.w + 'px'; im.style.height = Math.round(n.image.w / n.image.ar) + 'px'; } measure(); renderEdgesSoon(); }

function placeNew(){

  try {
    for (const f of files) {
      const head = new Uint8Array(await f.slice(0, 4).arrayBuffer());
      if (/\.html?$/i.test(f.name) || f.type === 'text/html') {
        const d = parseSharedHtml(await f.text());
        if (!d) { toast(`${f.name}: マップのデータが入っていません`, 4000); continue; }
        const dir = await importShared(d); if (dir) { last = dir; n++; }
        continue;
      }
      if (/\.zip$/i.test(f.name) || f.type === 'application/zip' || (head[0] === 0x50 && head[1] === 0x4b && head[2] === 3 && head[3] === 4)) {
        const ents = await readZip(f), byDir = new Map();
        for (const e of ents) { const m = e.name.match(/^(?:.*\/)?([^/]+)\/map\.json$/) || (e.name === 'map.json' ? [0, f.name.replace(/\.zip$/i, '')] : null); if (m && !/(^|\/)_trash\//.test(e.name)) byDir.set(e.name.slice(0, e.name.length - 'map.json'.length), m[1]); }
        for (const [prefix, dirName] of byDir) {
          const mj = ents.find(e => e.name === prefix + 'map.json'); const m = normalize(JSON.parse(new TextDecoder().decode(mj.data)));
          if (S.list.some(x => x.id === m.id)) m.id = 'm' + rid(8);
          const dir = await uniqueDir(safeDirName(dirName));
          for (const e of ents) if (e.name.startsWith(prefix + 'images/')) await S.backend.writeImage(dir, e.name.slice((prefix + 'images/').length), new Blob([e.data], { type: /\.webp$/i.test(e.name) ? 'image/webp' : /\.png$/i.test(e.name) ? 'image/png' : /\.gif$/i.test(e.name) ? 'image/gif' : /\.svg$/i.test(e.name) ? 'image/svg+xml' : 'image/jpeg' }));
          await S.backend.writeMap(dir, toJson(m), toMarkdown(m));
          S.list.push({ dir, id: m.id, title: m.title, updated: m.updated, count: m.nodes.length }); last = dir; n++;
        }
        if (!byDir.size) toast(`${f.name}: map.json が見つかりません`, 4000);
      } else if (/\.json$/i.test(f.name)) {
        const m = normalize(JSON.parse(await f.text())); m.nodes.forEach(x => delete x.image); if (S.list.some(x => x.id === m.id)) m.id = 'm' + rid(8);
        const dir = await uniqueDir(safeDirName(m.title));
        await S.backend.writeMap(dir, toJson(m), toMarkdown(m));
        S.list.push({ dir, id: m.id, title: m.title, updated: m.updated, count: m.nodes.length }); last = dir; n++;
      } else if (/\.(md|markdown|txt)$/i.test(f.name) || f.type.startsWith('text/')) {
        mdDir = last = await importMarkdown(await f.text(), f.name); n++;
      }
    }
  } catch (e) { console.error(e); toast('読み込めませんでした: ' + e.message, 5000); }
  if (n === 1 && last) openMap(last, { layout: last === mdDir });
  else { if (n) toast(`${n} 件読み込みました`); showHome(true); }
}

     #mmPreview   … 全体図(PNG)＋箇条書き。JavaScriptが動かない環境（iPhoneのファイルプレビュー等）でもこれが見える
     #mmData      … マップ本体と画像（JSON）
     #mmMd        … AI向けMarkdown
     （以降）       … このエディタ本体。JSが動く環境ではそのまま編集画面になる */
const SHARE_FORMAT = 'mindmap-share/1';
const SCRIPT_END = '<' + '/script';
const FONT_STACK = getComputedStyle(document.documentElement).getPropertyValue('--font') || 'sans-serif';
function blobToDataUrl(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
function dataUrlToBlob(u){
  const m = String(u).match(/^data:([^;,]*)(;base64)?,(.*)$/s); if (!m) return null;
  if (!m[2]) return new Blob([decodeURIComponent(m[3])], { type: m[1] });
  const bin = atob(m[3]), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: m[1] || 'application/octet-stream' });
}
function b64url(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
async function packMap(m){ const s = new Blob([JSON.stringify({ format: SHARE_FORMAT, map: m, images: {} })]).stream().pipeThrough(new CompressionStream('deflate-raw')); return b64url(new Uint8Array(await new Response(s).arrayBuffer())); }
async function unpackMap(str){ const s = new Blob([b64urlDecode(str)]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(s).text()); }

/* 全体図をPNGに描く（画面に出ているノードをそのまま描画） */
function hexMix(hex, a){ const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, m = c => Math.round(c * a + 255 * (1 - a)); return `rgb(${m(r)},${m(g)},${m(b)})`; }
function wrapLines(g, text, maxW){
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const ch of para) { if (line && g.measureText(line + ch).width > maxW) { out.push(line); line = ch.trimStart(); } else line += ch; }
    out.push(line);
  }
  return out;
}
function roundRectPath(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
async function renderMapPNG(maxDim = 1800){
  render(); measure();
  const ids = [...nodeEls.keys()]; if (!ids.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids) { const n = node(id), s = sz(id); x0 = Math.min(x0, n.x - s.w / 2); x1 = Math.max(x1, n.x + s.w / 2); y0 = Math.min(y0, n.y - s.h / 2); y1 = Math.max(y1, n.y + s.h / 2); }
  for (const t of $('#eg').querySelectorAll('text')) { const x = +t.getAttribute('x'), y = +t.getAttribute('y'); x0 = Math.min(x0, x - 60); x1 = Math.max(x1, x + 60); y0 = Math.min(y0, y - 10); y1 = Math.max(y1, y + 10); }
  const pad = 28, bw = x1 - x0 + pad * 2, bh = y1 - y0 + pad * 2;
  const k = Math.min(2, maxDim / Math.max(bw, bh));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(bw * k)); c.height = Math.max(1, Math.ceil(bh * k));
  const g = c.getContext('2d'); g.scale(k, k); g.translate(pad - x0, pad - y0);
  g.fillStyle = '#fbfaf7'; g.fillRect(x0 - pad, y0 - pad, bw, bh);
  g.lineCap = 'round';
  for (const p of $('#eg').querySelectorAll('path.e, path.x')) {
    const d = p.getAttribute('d'), cross = p.classList.contains('x');
    g.save(); g.lineWidth = 2; g.strokeStyle = cross ? '#c2410c' : (p.style.stroke || '#a19e95'); if (cross) g.setLineDash([6, 5]);
    g.stroke(new Path2D(d)); g.restore();
    if (cross) { const v = d.match(/-?[\d.]+/g).map(Number); if (v.length >= 6) { const [cx, cy, ex, ey] = v.slice(-4), a = Math.atan2(ey - cy, ex - cx);
      g.fillStyle = '#c2410c'; g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex - 10 * Math.cos(a - 0.4), ey - 10 * Math.sin(a - 0.4)); g.lineTo(ex - 10 * Math.cos(a + 0.4), ey - 10 * Math.sin(a + 0.4)); g.closePath(); g.fill(); } }
  }
  for (const t of $('#eg').querySelectorAll('text')) {
    g.font = `12px ${FONT_STACK}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 4; g.strokeStyle = '#fbfaf7'; g.fillStyle = '#c2410c';
    g.strokeText(t.textContent, +t.getAttribute('x'), +t.getAttribute('y')); g.fillText(t.textContent, +t.getAttribute('x'), +t.getAttribute('y'));
  }
  for (const id of ids) {
    const n = node(id), el = nodeEls.get(id), w = el.offsetWidth, h = el.offsetHeight, x = n.x - w / 2, y = n.y - h / 2, isRoot = id === S.m.rootId;
    const col = n.color ? COLOR_HEX[n.color] : '#cfccc3';
    roundRectPath(g, x, y, w, h, 12); g.fillStyle = n.color ? hexMix(col, 0.13) : '#ffffff'; g.fill();
    g.lineWidth = isRoot ? 2 : 1.5; g.strokeStyle = n.color ? col : (isRoot ? '#b9b6ad' : '#cfccc3'); if (!n.parent && !isRoot) g.setLineDash([5, 4]); g.stroke(); g.setLineDash([]);
    const bx = x + el.clientLeft, by = y + el.clientTop;
    const im = el.querySelector('img');
    if (im && im.complete && im.naturalWidth) { g.save(); roundRectPath(g, bx + im.offsetLeft, by + im.offsetTop, im.offsetWidth, im.offsetHeight, 8); g.clip();
      try { g.drawImage(im, bx + im.offsetLeft, by + im.offsetTop, im.offsetWidth, im.offsetHeight); } catch {} g.restore(); }
    const t = el.querySelector('.txt');
    if (n.text && t && t.offsetWidth) {
      const fs = isRoot ? 18 : 14, lh = fs * 1.45, base = isRoot ? 700 : 400;
      const font = c => `${c.b ? (isRoot ? 900 : 700) : base} ${fs}px ${FONT_STACK}`;
      const lines = [[]]; let lw = 0; const maxW = t.offsetWidth + 4;
      for (const c of parseMarkup(n.text)) {
        if (c.ch === '\n') { lines.push([]); lw = 0; continue; }
        g.font = font(c); const w = g.measureText(c.ch).width;
        if (lw + w > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; if (c.ch === ' ') continue; }
        lines[lines.length - 1].push({ ...c, w }); lw += w;
      }
      g.textAlign = 'left'; g.textBaseline = 'middle';
      let ty = by + t.offsetTop + lh / 2;
      for (const ln of lines) {
        let tx = bx + t.offsetLeft + t.offsetWidth / 2 - ln.reduce((a, c) => a + c.w, 0) / 2;
        for (const c of ln) {
          g.font = font(c); g.fillStyle = c.c ? (COLOR_HEX[c.c] || '#1e1e1c') : c.href ? '#2f6fde' : '#1e1e1c';
          g.fillText(c.ch, tx, ty);
          if (c.u || c.href) g.fillRect(tx, ty + fs * 0.62, c.w, 1.3);
          tx += c.w;
        }
        ty += lh;
      }
    }
  }
  return new Promise(r => c.toBlob(r, 'image/png'));
}

function outlineHtml(m){
  const T = mapTools(m);
  const li = id => { const n = T.N.get(id), ks = T.kids(id);
    return `<li>${n.text ? richHtml(n.text) : (n.image ? '（画像）' : '（空）')}${n.note ? `<div class="note">${esc(n.note)}</div>` : ''}${ks.length ? `<ul>${ks.map(li).join('')}</ul>` : ''}</li>`; };
  const floats = T.kids(null).filter(id => id !== m.rootId);
  let h = `<ul>${li(m.rootId)}</ul>`;
  if (floats.length) h += `<h3>独立ノード</h3><ul>${floats.map(li).join('')}</ul>`;
  if (m.links.length) h += `<h3>関連</h3><ul>${m.links.map(k => `<li>${esc(plain(T.N.get(k.from)?.text))} → ${esc(plain(T.N.get(k.to)?.text))}${k.label ? '：' + esc(k.label) : ''}</li>`).join('')}</ul>`;
  return h;
}

async function bootFileMode(emb){
  let data; try { data = JSON.parse(emb.textContent); } catch { return false; }
  document.getElementById('mmFileStyle')?.remove(); document.getElementById('mmPreview')?.remove();
  S.fileMode = true; S.sharedApp = data.app || ''; S.backend = new MemoryBackend();
  const m = normalize(data.map), dir = safeDirName(m.title);
  for (const [f, u] of Object.entries(data.images || {})) { const b = dataUrlToBlob(u); if (b) await S.backend.writeImage(dir, f, b); }
  await S.backend.writeMap(dir, toJson(m), toMarkdown(m));
  S.list = await S.backend.list();
  $('#hNew').classList.add('hidden'); $('#hImport').classList.add('hidden');
  await openMap(dir); S.fileChanged = false;
  toast('共有されたマップです。編集したら右上の「共有」から送り返せます', 4200);
  return true;
}
// 共有ファイルの中のマップを、自分の保存先（アプリ側）にコピー
async function saveSharedToMine(){
  let target = null;
  try { const h = await kvGet('dirHandle'); if (h && (await h.queryPermission?.({ mode: 'readwrite' })) === 'granted') target = new FolderBackend(await mapsDir(h), h.name); } catch {}
  if (!target) target = new BrowserBackend();
  const it = S.list[0]; if (!it) return;
  if (S.m) await saveNow();
  const have = new Set((await target.list().catch(() => [])).map(x => x.dir));
  let d = it.dir, i = 2; while (have.has(d)) d = `${it.dir} (${i++})`;
  await copyMap(S.backend, it.dir, target, d);
  toast(`${target.label} に保存しました（mindmap.html から開けます）`, 4000);
}

const README_MD = `# maps フォルダについて

このフォルダは mindmap.html で作ったマインドマップの保存場所です。
人間にも AI にも読みやすいよう、1つのマップ＝1つのフォルダにまとめています。

\`\`\`
maps/
  README.md          … この説明
  index.md           … マップの一覧（自動生成）
  _trash/            … 削除したマップ（ここから手動で戻せます）
  2026-10-10_テーマ/
    map.md           … 【AIはこれを読む】内容を階層Markdownで書き出したもの（自動生成）
    map.json         … 【正本】位置・色・画像サイズなどを含む全データ
    images/          … ノードに貼った画像（ファイル名は ノードID-乱数.拡張子）
\`\`\`

## map.md の書式（mindmap-md/1）

\`\`\`markdown
---
format: mindmap-md/1
title: "旅行計画"
updated: 2026-10-10T21:40:00+09:00
---

# 旅行計画 <!-- id:root -->

- 行き先 <!-- id:n3k9a -->
  - 京都 <!-- id:n8x2p -->
    > 紅葉は11月下旬が見頃
    ![京都](images/n8x2p-a1b.webp)
- 予算 <!-- id:n0q7z -->

## 独立ノード

- あとで考える <!-- id:n5t1c -->

## 関連

- 京都 → 予算: 宿泊費が高い <!-- link:n8x2p>n0q7z -->
\`\`\`

- \`# 見出し\` が中心テーマ。箇条書きのインデント（半角スペース2つ）が階層です。
- \`> \` で始まる行はそのノードのメモ。\`![..](images/..)\` はそのノードの画像。
- \`<!-- id:... -->\` はノードID。AI が既存ノードを書き換えるときは **IDを残す** と、エディタ側で位置・色・画像が引き継がれます。新しいノードには ID を付けなくて構いません。
- 「## 独立ノード」はどこにもつながっていないノード、「## 関連」は枝とは別の関連線（矢印）です。
- ノード内の改行は \`<br>\` で表します。
- 文字の書式: \`**太字**\`、\`<u>下線</u>\`、\`<span style="color:red">文字色</span>\`（色名は red / orange / green / teal / blue / purple / pink / gray）、\`[表示する文字](https://…)\` でリンク。URLをそのまま書いても自動でリンクになります。

## AI に編集してもらうとき

1. エディタ右上の ✦ ボタン（または map.md）で Markdown をコピーして AI に渡す
2. 「この書式のまま、ID は残して、追加・修正したマップを返して」と頼む
3. 返ってきた Markdown をエディタの「⋯ → AIの編集を取り込む」に貼り付ける

map.md は保存のたびに map.json から作り直されます。map.md を直接編集しても map.json には反映されないので、取り込み機能を使ってください。

## map.json の構造（mindmap/1）

\`\`\`json
{
  "format": "mindmap/1", "id": "m…", "title": "…", "created": "…", "updated": "…",
  "rootId": "root",
  "nodes": [
    { "id": "root", "parent": null, "text": "…", "note": "", "x": 0, "y": 0, "color": "" },
    { "id": "n3k9a", "parent": "root", "text": "…", "note": "…", "x": 240, "y": -40, "color": "blue",
      "image": { "file": "n3k9a-a1b.webp", "w": 220, "ar": 1.5 }, "collapsed": false }
  ],
  "links": [ { "id": "l…", "from": "n8x2p", "to": "n0q7z", "label": "…" } ]
}
\`\`\`

- text は上記の書式記法を含む文字列です（改行は \\n）。
- x, y はノード中心の座標（px）。兄弟の順番は y（上から下）で決まります。
- parent が null でルート以外のノードは「独立ノード」です。
`;
